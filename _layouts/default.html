<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>

    {% if site.google_analytics %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}
    <meta charset="UTF-8">

    {% seo %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#157878">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="shortcut icon" href="assets/images/Favicon.ico" type="image/x-icon">
    <link rel="icon" href="assets/images/Favicon.ico" type="image/x-icon">
    <script src="{{ '/assets/js/theme-toggle.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/translations.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/language-selector.js' | relative_url }}" defer></script>
</head>
<body>

<header class="page-header" role="banner">
    <div class="header-content">
        <h1 class="project-name">
            <img src="assets/images/Logo_With_Title_White.png" alt="{{ site.data.translations[site.default_lang].logo_alt }}" />
        </h1>
        <div class="header-actions">
             <button id="theme-toggle" class="theme-toggle-btn" data-i18n-aria="theme_toggle">
                 <span class="theme-icon">🌙</span>
             </button>
            <a href="/documentation" class="btn" data-i18n="nav_documentation"></a>
            <a href="https://github.com/Server-Factory/Mail-Server-Factory" class="btn" target="_blank" data-i18n="nav_view_github"></a>
            <a href="https://github.com/Server-Factory/Mail-Server-Factory/releases" class="btn" target="_blank" data-i18n="nav_download"></a>
        </div>
    </div>
    <h2 class="project-tagline" data-i18n="{{ page.description_key | default: 'page_description' }}"></h2>
</header>

<main id="content" class="main-content" role="main">
    {{ content }}

    <footer class="site-footer">
        {% if site.github.is_project_page %}
        <span class="site-footer-owner">
            <a href="{{ site.github.repository_url }}" target="_blank" data-i18n="footer_website_maintained">Website</a> <span data-i18n="footer_website_maintained_text">is maintained by</span>
            <a href="{{ site.github.owner_url }}" target="_blank" data-i18n="footer_server_factory">Server Factory</a>.
        </span>
        {% endif %}
        <span class="site-footer-credits"><span data-i18n="footer_generated_by">This page was generated by</span> <a href="https://pages.github.com" target="_blank" data-i18n="footer_github_pages">GitHub Pages</a>.</span>
    </footer>
</main>
</body>
</html>
