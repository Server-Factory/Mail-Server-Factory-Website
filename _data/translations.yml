    изолацију, скалабилност и лако управљање. Покрените на било ком хосту који подржава
    Docker.
  feature_security_desc: Аутоматска генерација TLS сертификата са само-потписаним
    CA, аутентификација базирана на SSH кључевима и индустријски стандарди безбедности
    одмах доступни.
  feature_ssh_desc: Покретање на удаљеним серверима преко SSH са груписањем конекција,
    аутоматским преносом фајлова и робусним руковањем грешкама.
  feature_tested_desc: 100% успешност извршавања тестова са 47 свеобухватних тестова.
    Свака компонента је проверена пре издавања.
  feature_zero_touch_desc: Напишите једноставан JSON конфигурациони фајл и дозволите
    Mail Server Factory-ју да уради све остало - од инсталације до иницијализације.
    Није потребна ручна конфигурација.
