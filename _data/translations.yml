  feature_docker: Docker मूल
  feature_docker_desc: प्रत्येक घटक अपने स्वयं के Docker कंटेनर में चलता है, जो अलगाव, स्केलेबिलिटी और आसान प्रबंधन सुनिश्चित करता है। किसी भी Docker-सक्षम होस्ट पर तैनात करें।
  feature_security: सुरक्षा अंतर्निहित
