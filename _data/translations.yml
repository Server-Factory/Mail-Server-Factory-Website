  feature_complete_desc: Postfix، Dovecot، PostgreSQL، Rspamd، Redis و ClamAV از پیش
    پیکربندی شده و به طور یکپارچه با هم کار می‌کنند.
  feature_docker_desc: هر مؤلفه در کانتینر Docker خود اجرا می‌شود و ایزوله‌سازی، مقیاس‌پذیری
    و مدیریت آسان را تضمین می‌کند. در هر میزبانی با قابلیت Docker مستقر کنید.
  feature_security_desc: تولید خودکار گواهی TLS با CA خودامضا، احراز هویت مبتنی بر
    کلید SSH و شیوه‌های امنیتی استاندارد صنعتی از جعبه.
  feature_ssh_desc: استقرار در سرورهای راه دور از طریق SSH با اتصال گروهی، انتقال
    خودکار فایل‌ها و مدیریت خطای قوی.
  feature_tested_desc: نرخ موفقیت ۱۰۰٪ اجرای تست با ۴۷ تست جامع. هر مؤلفه قبل از انتشار
    تأیید می‌شود.
  feature_zero_touch_desc: یک فایل پیکربندی JSON ساده بنویسید و اجازه دهید Mail Server
    Factory همه چیز را مدیریت کند - از نصب تا راه‌اندازی. هیچ پیکربندی دستی مورد نیاز
    نیست.
