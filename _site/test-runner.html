<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Test Runner - Mail Server Factory</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background: #f8f9fa;
        }
        
        .test-container {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .test-title {
            font-size: 2rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 1rem;
        }
        
        .test-button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1rem;
            margin: 1rem 0;
            transition: all 0.3s ease;
        }
        
        .test-button:hover {
            background: #357abd;
            transform: translateY(-2px);
        }
        
        .test-results {
            margin-top: 2rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.875rem;
        }
        
        .test-log {
            margin: 0.5rem 0;
            padding: 0.5rem;
            border-radius: 4px;
        }
        
        .log-pass { background: #d4edda; color: #155724; }
        .log-fail { background: #f8d7da; color: #721c24; }
        .log-warning { background: #fff3cd; color: #856404; }
        .log-info { background: #d1ecf1; color: #0c5460; }
        
        .summary {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
        }
        
        .summary-pass { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .summary-fail { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1 class="test-title">Mail Server Factory Website Test Runner</h1>
        <p>Run comprehensive tests for website functionality, language switching, and theme support.</p>
        
        <button class="test-button" onclick="runTests()">Run All Tests</button>
        <button class="test-button" onclick="clearResults()" style="background: #6c757d;">Clear Results</button>
        
        <div id="test-results" class="test-results">
            <div class="test-log log-info">Click "Run All Tests" to start testing...</div>
        </div>
        
        <div id="test-summary" class="summary"></div>
    </div>

    <script src="test-website.js"></script>
    <script>
        function runTests() {
            const resultsDiv = document.getElementById('test-results');
            const summaryDiv = document.getElementById('test-summary');
            
            // Clear previous results
            resultsDiv.innerHTML = '';
            summaryDiv.innerHTML = '';
            
            // Create test instance
            const tester = new WebsiteTester();
            
            // Override log method to display in UI
            const originalLog = tester.log.bind(tester);
            tester.log = function(message, status = 'info') {
                originalLog(message, status);
                
                const logDiv = document.createElement('div');
                logDiv.className = `test-log log-${status}`;
                logDiv.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
                resultsDiv.appendChild(logDiv);
                
                // Scroll to bottom
                resultsDiv.scrollTop = resultsDiv.scrollHeight;
            };
            
            // Run tests
            const success = tester.runAllTests();
            
            // Show summary
            const results = tester.exportResults();
            summaryDiv.className = success ? 'summary summary-pass' : 'summary summary-fail';
            summaryDiv.innerHTML = `
                <strong>Test Summary:</strong><br>
                ✅ Passed: ${results.summary.passed}<br>
                ❌ Failed: ${results.summary.failed}<br>
                ⚠️ Warnings: ${results.summary.warnings}<br>
                📊 Total: ${results.summary.total} tests
            `;
        }
        
        function clearResults() {
            document.getElementById('test-results').innerHTML = 
                '<div class="test-log log-info">Click "Run All Tests" to start testing...</div>';
            document.getElementById('test-summary').innerHTML = '';
        }
        
        // Auto-run tests in development
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(runTests, 500);
            });
        }
    </script>
</body>
</html>
